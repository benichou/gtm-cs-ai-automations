[project]
name = "gtm-sales-leadership-ai-automations"
version = "0.1.0"
description = "Sales-leadership pipeline-health Model Context Protocol server. Answers weekly aggregation questions a VP Sales actually asks on Monday: forecast roll-up, deals closing this period, deals to inspect, per-rep scorecard."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Franck Benichou" }]
dependencies = [
    "mcp[cli]>=1.2",
]

[project.scripts]
gtm-sales-leadership-mcp = "gtm_sales_leadership.mcp:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtm_sales_leadership"]
