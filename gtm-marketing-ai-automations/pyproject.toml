[project]
name = "gtm-marketing-ai-automations"
version = "0.1.0"
description = "Content-repurposing automation for marketers — plugin + slash command + 2 skills + MCP server + audit hook"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Franck Benichou" }]
dependencies = [
    "mcp[cli]>=1.2",
]

[project.scripts]
gtm-marketing-mcp = "gtm_marketing.mcp:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtm_marketing"]
