[project]
name = "gtm-revops-ai-automations"
version = "0.1.0"
description = "Pipeline-hygiene + roll-up Model Context Protocol server for Revenue Operations analysts"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Franck Benichou" }]
dependencies = [
    "mcp[cli]>=1.2",
]

[project.scripts]
gtm-revops-mcp = "gtm_revops.mcp:main"
gtm-revops-seed = "gtm_revops.seed:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtm_revops"]
