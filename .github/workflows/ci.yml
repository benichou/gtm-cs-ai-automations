name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - gtm-cs-ai-automations
          - gtm-sales-ai-automations
          - gtm-revops-ai-automations
          - gtm-marketing-ai-automations
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-extras

      - name: Lint
        working-directory: ${{ matrix.plugin }}
        # `scripts/` is optional per-plugin; pass only the dirs that exist
        # so the matrix doesn't fail on plugins without a scripts directory.
        run: |
          paths=(src tests)
          [ -d scripts ] && paths+=(scripts)
          uv run ruff check "${paths[@]}"

      - name: Test
        working-directory: ${{ matrix.plugin }}
        run: uv run pytest -v

  validate-manifests:
    name: validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate marketplace + plugin manifests + skill frontmatter
        run: python scripts/validate_manifests.py
